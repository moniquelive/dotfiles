# Ef Cherie, ported from Protesilaos Stavrou's Ef themes.
[app]
overall = { bg = "#190a0f" }

[mgr]
cwd = { fg = "#8fbaef" }
find_keyword = { fg = "#e5b76f", bold = true, italic = true, underline = true }
find_position = { fg = "#ef80bf", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#8fcfdf", italic = true }
marker_copied = { fg = "#60b444", bg = "#60b444" }
marker_cut = { fg = "#ff7359", bg = "#ff7359" }
marker_marked = { fg = "#ef80bf", bg = "#ef80bf" }
marker_selected = { fg = "#8fa5f6", bg = "#8fa5f6" }
count_copied = { fg = "#190a0f", bg = "#60b444" }
count_cut = { fg = "#190a0f", bg = "#ff7359" }
count_selected = { fg = "#190a0f", bg = "#8fa5f6" }
border_symbol = "│"
border_style = { fg = "#695960" }
syntect_theme = "tmtheme.xml"

[tabs]
active = { fg = "#d3cfcf", bg = "#392a2f", bold = true }
inactive = { fg = "#808898", bg = "#291f26" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#190a0f", bg = "#8fa5f6", bold = true }
normal_alt = { fg = "#8fa5f6", bg = "#291f26", bold = true }
select_main = { fg = "#190a0f", bg = "#ef80bf", bold = true }
select_alt = { fg = "#ef80bf", bg = "#291f26", bold = true }
unset_main = { fg = "#190a0f", bg = "#df7fff", bold = true }
unset_alt = { fg = "#df7fff", bg = "#291f26", bold = true }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall = { bg = "#190a0f" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#695960" }
perm_type = { fg = "#f470df" }
perm_read = { fg = "#e5b76f" }
perm_write = { fg = "#ff7359" }
perm_exec = { fg = "#60b444" }
progress_label = { fg = "#d3cfcf", bold = true }
progress_normal = { fg = "#8fa5f6", bg = "#291f26" }
progress_error = { fg = "#ff656f", bg = "#291f26" }

[which]
cols = 3
mask = { bg = "#291f26" }
cand = { fg = "#8fbaef" }
rest = { fg = "#808898" }
desc = { fg = "#ef80bf" }
separator = "  "
separator_style = { fg = "#695960" }

[confirm]
border = { fg = "#695960" }
title = { fg = "#ff7359", bold = true }
body = { fg = "#d3cfcf" }
list = { fg = "#d3cfcf" }
btn_yes = { fg = "#190a0f", bg = "#60b444", bold = true }
btn_no = { fg = "#190a0f", bg = "#ff7359", bold = true }
btn_labels = [ "  [y]es  ", "  (n)o  " ]

[spot]
border = { fg = "#695960" }
title = { fg = "#8fbaef", bold = true }
tbl_col = { fg = "#8fbaef" }
tbl_cell = { fg = "#190a0f", bg = "#e5b76f", bold = true }

[notify]
title_info = { fg = "#60b444" }
title_warn = { fg = "#ea9955" }
title_error = { fg = "#ff656f" }
icon_info = ""
icon_warn = ""
icon_error = ""

[pick]
border = { fg = "#695960" }
active = { fg = "#ef80bf", bold = true }
inactive = { fg = "#808898" }

[input]
border = { fg = "#7f9ab4" }
title = { fg = "#7f9ab4", bold = true }
value = { fg = "#d3cfcf" }
selected = { bg = "#401f33" }

[cmp]
border = { fg = "#7f9ab4" }
active = { fg = "#d3cfcf", bg = "#401f33", bold = true }
inactive = { fg = "#808898" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#695960" }
title = { fg = "#695960", bold = true }
hovered = { fg = "#d3cfcf", bg = "#401f33", bold = true }

[help]
on = { fg = "#60b444" }
run = { fg = "#ef80bf" }
desc = { fg = "#e5b76f" }
hovered = { bg = "#401f33", bold = true }
footer = { fg = "#d3cfcf", bg = "#190a0f" }

[filetype]
rules = [
  { mime = "image/*", fg = "#e5b76f" },
  { mime = "{audio,video}/*", fg = "#ef80bf" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff7359" },
  { mime = "application/{pdf,doc,rtf}", fg = "#8fbaef" },
  { url = "*", is = "orphan", fg = "#190a0f", bg = "#ff7359" },
  { url = "*", is = "exec", fg = "#60b444" },
  { url = "*", is = "dummy", fg = "#190a0f", bg = "#ff7359" },
  { url = "*/", is = "dummy", fg = "#190a0f", bg = "#ff7359" },
  { url = "*", fg = "#d3cfcf" },
  { url = "*/", fg = "#8fa5f6" },
]
